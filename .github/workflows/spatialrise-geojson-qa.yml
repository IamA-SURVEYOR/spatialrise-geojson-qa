name: SpatialRise GeoJSON QA checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example GeoJSON
        run: python qa.py sample_data/sample_sites.geojson --required-field name --strict
